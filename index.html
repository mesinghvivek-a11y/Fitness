<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101b17" />
  <meta name="description" content="A local-first fitness, nutrition and hydration tracker." />
  <title>Forma — Daily health, in rhythm</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-lockup">
        <div class="brand-mark"><span></span><span></span><span></span></div>
        <div><div class="brand-name">forma<span class="brand-period">.</span></div><div class="brand-caption">YOUR DAILY RHYTHM</div></div>
      </div>
      <div class="header-actions">
        <div class="sync-status" id="syncStatus"><span class="sync-dot"></span><span>Saved locally</span></div>
        <button class="icon-button" id="settingsButton" aria-label="Open settings" title="Targets & settings">⚙</button>
      </div>
    </header>

    <div class="domain-tabs" role="tablist" aria-label="Tracking domain">
      <button class="domain-tab active" data-action="domain" data-value="diet" data-domain="diet"><span class="domain-emoji">🍎</span><span>Diet</span></button>
      <button class="domain-tab" data-action="domain" data-value="workout" data-domain="workout"><span class="domain-emoji">🏋️</span><span>Workout</span></button>
      <button class="domain-tab" data-action="domain" data-value="water" data-domain="water"><span class="domain-emoji">💧</span><span>Water</span></button>
    </div>

    <section class="date-strip" aria-label="Choose date">
      <button class="date-arrow" id="prevDate" aria-label="Previous day">‹</button>
      <div class="date-options" id="dateOptions"></div>
      <button class="date-arrow" id="nextDate" aria-label="Next day">›</button>
      <label class="calendar-button" aria-label="Pick a date">▦<input type="date" id="datePicker" /></label>
    </section>

    <main id="mainContent" class="main-content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="bottom-tab" data-action="tab" data-tab="analyze"><span class="bottom-icon">▥</span><span>Analyze</span></button>
      <button class="center-add" id="globalAdd" aria-label="Add entry"><span>＋</span></button>
      <button class="bottom-tab active" data-action="tab" data-tab="timeline"><span class="bottom-icon">◷</span><span>Timeline</span></button>
    </nav>
    <div class="safe-area"></div>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
